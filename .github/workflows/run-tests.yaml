name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SimpRTP and Addons
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and install SimpRTP
        run: mvn -B -DskipTests install

      - name: Smoke test on Folia 26.1.2 build 8
        shell: bash
        run: |
          set -euo pipefail

          server_dir="$RUNNER_TEMP/folia-smoke"
          mkdir -p "$server_dir/plugins" "$server_dir/cache"

          curl --fail --location --retry 5 --retry-all-errors \
            --output "$server_dir/folia.jar" \
            "https://fill-data.papermc.io/v1/objects/607afd1c3320008e1ffd2eaee6780ace4419d5f8c527b75e79f259be79ebf57b/folia-26.1.2-8.jar"
          echo "607afd1c3320008e1ffd2eaee6780ace4419d5f8c527b75e79f259be79ebf57b  $server_dir/folia.jar" | sha256sum --check

          curl --fail --location --retry 5 --retry-all-errors \
            --output "$server_dir/cache/mojang_26.1.2.jar" \
            "https://piston-data.mojang.com/v1/objects/97ccd4c0ed3f81bbb7bfacddd1090b0c56f9bc51/server.jar"
          echo "cd47e7c38328f64768fd17af8fcd8b22496b40b63d4ffee81e71ae059fedcb42  $server_dir/cache/mojang_26.1.2.jar" | sha256sum --check

          cp target/SimpRTP-*.jar "$server_dir/plugins/SimpRTP.jar"
          printf 'eula=true\n' > "$server_dir/eula.txt"
          printf '%s\n' \
            'allow-nether=false' \
            'enable-query=false' \
            'enable-rcon=false' \
            'enable-status=false' \
            'generate-structures=false' \
            'level-name=world' \
            'online-mode=false' \
            'server-ip=127.0.0.1' \
            'server-port=25585' \
            'simulation-distance=2' \
            'spawn-protection=0' \
            'view-distance=2' > "$server_dir/server.properties"

          SERVER_DIR="$server_dir" python3 - <<'PY'
          import os
          import subprocess
          import sys
          import threading

          server_dir = os.environ["SERVER_DIR"]
          process = subprocess.Popen(
              ["java", "-Xms1G", "-Xmx1G", "-jar", "folia.jar", "--nogui"],
              cwd=server_dir,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              bufsize=1,
          )

          output = []
          commands_sent = False
          timed_out = False

          def stop_server():
              if process.poll() is None:
                  process.stdin.write("stop\n")
                  process.stdin.flush()

          def run_checks():
              if process.poll() is None:
                  process.stdin.write("version\nplugins\nsimprtp version\nsimprtp info\n")
                  process.stdin.flush()
                  threading.Timer(5, stop_server).start()

          def abort_server():
              global timed_out
              timed_out = True
              if process.poll() is None:
                  process.kill()

          timeout = threading.Timer(180, abort_server)
          timeout.start()

          for line in process.stdout:
              print(line, end="")
              output.append(line)
              if not commands_sent and "Done (" in line:
                  commands_sent = True
                  # Folia 26.1.2 logs Done just before its console command source
                  # has a world. Give that source one global tick to settle.
                  threading.Timer(2, run_checks).start()

          return_code = process.wait()
          timeout.cancel()
          log = "".join(output)

          required = (
              "Loading Folia 26.1.2-8-",
              "Enabling SimpRTP v",
              "[SimpRTP] Version #",
              "----- SimpRTP | Info -----",
          )
          missing = [entry for entry in required if entry not in log]
          forbidden = (
              "Could not load 'plugins/SimpRTP.jar'",
              "Error occurred while enabling SimpRTP",
              "Thread ownership",
          )
          found = [entry for entry in forbidden if entry in log]

          if timed_out or return_code != 0 or missing or found:
              print(
                  f"Smoke test failed: timed_out={timed_out}, return_code={return_code}, "
                  f"missing={missing}, forbidden={found}",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Build SimpRTPAddons
        run: mvn -B -DskipTests package
        working-directory: BetterRTPAddons

      - name: Upload SimpRTP artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpRTP
          path: target/SimpRTP-*.jar
          if-no-files-found: error

      - name: Upload SimpRTPAddons artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimpRTPAddons
          path: BetterRTPAddons/target/SimpRTPAddons-*.jar
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          namespace = {"m": "http://maven.apache.org/POM/4.0.0"}
          root = ET.parse("pom.xml").getroot()
          print(root.findtext("m:version", namespaces=namespace))
          PY
          )"

          tag="v${version}"
          title="SimpRTP ${version}"
          main_jar="target/SimpRTP-${version}.jar"
          addons_jar="BetterRTPAddons/target/SimpRTPAddons-${version}.jar"

          test -f "$main_jar"
          test -f "$addons_jar"

          cat > release-notes.md <<EOF
          Automated release for SimpRTP ${version}.

          Built from commit ${GITHUB_SHA}.

          Artifacts:
          - SimpRTP-${version}.jar
          - SimpRTPAddons-${version}.jar
          EOF

          if gh release view "$tag" >/dev/null 2>&1; then
            git tag --force "$tag" "$GITHUB_SHA"
            git push --force origin "refs/tags/$tag"
            gh release edit "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md --latest
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md --latest
          fi

          gh release upload "$tag" "$main_jar" "$addons_jar" --clobber
