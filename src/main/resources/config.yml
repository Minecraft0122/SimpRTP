# SimpRTP 插件，作者 SuperRonanCraft
# 如需帮助，请访问：https://ronanplugins.com/discord

# 服务器默认语言。玩家可使用 /srtp language 单独选择语言。
Language-File: 'chs.yml'

Settings:
  ## 是否在控制台输出调试信息
  Debugger: false
  ## 找不到安全位置时的最大尝试次数
  MaxAttempts: 32
  RtpOnFirstJoin:
    Enabled: false # 玩家首次加入服务器时是否自动随机传送
    World: 'world' # 首次随机传送的目标世界
    SetAsRespawn: false # 是否将首次传送位置设为玩家重生点
  Cooldown:
    Enabled: true # 是否启用冷却时间
    LockAfter: 0 # 随机传送达到此次数后永久锁定；设为 0 禁用
    Time: 600 # 冷却时间，单位：秒
    PerWorld: false # 是否为每个世界分别计算冷却
  Delay:
    Enabled: true # 是否启用传送前等待
    Time: 5 # 等待时间，单位：秒；设为 0 禁用
    CancelOnMove: true # 等待期间移动是否取消传送
  Logger:
    Enabled: true # 是否将随机传送事件写入 log.log
    LogToConsole: false # 是否同时输出到控制台
    Format: 'yyyy-MM-dd HH:mm:ss' # 日志时间格式

# 未单独配置的世界使用以下默认设置
Default:
  UseWorldBorder: false # 是否使用原版世界边界作为传送范围
  ## 留空 [] 表示允许所有生物群系
  Biomes: []
  MaxRadius: 1000 # 最大半径
  MinRadius: 10 # 最小半径
  ## 启用 UseWorldBorder 后会忽略中心坐标
  CenterX: 0
  CenterZ: 0
  Shape: 'square' # 范围形状：square（方形）或 circle（圆形）
  MaxY: 320 # 最大高度
  MinY: 0 # 最小高度
  RTPOnDeath: false # 玩家死亡时是否随机传送

## 不允许作为落脚点的方块。材质名称参考 Bukkit Material。
BlacklistedBlocks:
  - water
  - lava
  - cactus
  - air
  - cave_air
  - void_air
  - bedrock
  - oak_leaves
  - jungle_leaves
  - kelp

## 禁止使用随机传送的世界；若配置了世界重定向则不受此限制
DisabledWorlds:
  - prison
  - creative

## 为指定世界设置独立的范围、中心、价格和冷却等参数
## MaxRadius 与 MinRadius 必须为正数，且不能相等
CustomWorlds:
  - custom_world_1:
      UseWorldBorder: false
      ## 启用世界边界后，仅 MinRadius 仍会生效
      MaxRadius: 1000
      MinRadius: 100
      CenterX: 0
      CenterZ: 0
      Price: 50
      Shape: 'square'
      MaxY: 320
      MinY: 0
      Cooldown: 60
  - other_custom_world:
      MaxRadius: 10000
      MinRadius: 150
      CenterX: 123
      CenterZ: -123
      Price: 0
      ## 可选：限制允许传送到的生物群系
      Biomes:
        - 'desert'
        - 'forest'
      Shape: 'circle'
      RTPOnDeath: true

## 玩家在某世界执行 /srtp 时，将其重定向到另一个世界
Overrides:
  # 格式：当前世界: 目标世界
  - master_world: 'world'
  - creative_world: 'world'

## 指定世界类型。可用值：NORMAL、NETHER
WorldType:
  - world: NORMAL
  - world_nether: NETHER
  - world_the_end: NORMAL

## 权限组专用传送参数；玩家需拥有 simprtp.group.<组名>
PermissionGroup:
  Enabled: false
  Groups:
    - vip:
        - Build_World:
            Priority: 0 # 数值越小优先级越高
            MaxRadius: 10000
            MinRadius: 1000
            Price: 100
            Cooldown: 500 # 可选
        - Survival_World:
            Priority: 10
            UseWorldBorder: false
            MaxRadius: 5000
            MinRadius: 1000
            CenterX: 10
            CenterZ: 10
            Price: 10
            MaxY: 320
            MinY: 0
    - vip2:
        - Build_World:
            MaxRadius: 25000
            MinRadius: 10000
            Price: 15
            Cooldown: 1500
