Economy:
  ## 是否收取随机传送费用？包括所有普通世界和自定义世界
  Enabled: false
  ## 设为 0 表示免费，并发送 Success.Bypass 消息
  ## 拥有 simprtp.bypass.economy 权限的玩家不会被收费
  Price: 500

Hunger: # 是否消耗饥饿值，避免玩家利用随机传送逃生
  Enabled: false
  Honches: 4

CustomWorlds:
  ## 是否为自定义世界启用独立收费
  Enabled: true
  Prices:
    ## 没有 simprtp.bypass.economy 权限的玩家在 world 中使用 /srtp 时收取 50
  - world: 50
    ## 价格设为 0 时会发送 Success.Bypass 消息
  - world_end: 0
