permissions:
    simprtp.*:
        children:
            simprtp.use: true
            simprtp.world: true
            simprtp.world.*: true
            simprtp.bypass.*: true
            simprtp.player: true
            simprtp.reload: true
            simprtp.updater: true
            simprtp.group.*: true
    simprtp.world:
        description: Ability to use the world command
    simprtp.world.*:
        description: RTP in all enabled worlds
    simprtp.world.<world>:
        description: RTP in world named world
    simprtp.bypass.*:
        children:
            simprtp.bypass.cooldown: true
            simprtp.bypass.delay: true
            simprtp.bypass.economy: true
            simprtp.bypass.hunger: true
    simprtp.use:
        description: Use RTP command
        default: true
    simprtp.player:
        description: RTP another player
    simprtp.biome:
        description: RTP to specific biomes
    simprtp.sign:
        description: Ability to create an RTP sign
    #Locations
    simprtp.location:
        description: Ability to use the location command
    simprtp.location.*:
        description: Ability to use all locations if permissions are enabled in locations.yml
        default: op
    #Bypasses
    simprtp.bypass.cooldown:
        description: Bypass cooldowns
    simprtp.bypass.delay:
        description: Bypass delays
    simprtp.bypass.economy:
        description: Bypass economy
    simprtp.bypass.hunger:
        description: Bypass hunger
    #Reload
    simprtp.reload:
        description: Reload the config
        default: op
    simprtp.updater:
        description: Get notification on new updates
        default: op
    simprtp.test:
        description: While debugger enabled, be able to test particles, potion effects and sounds
        default: op
    #Permission Groups
    simprtp.group.*:
        description: Allow access to all permission groups
        default: op