Sounds:
  Enabled: true
  ProtocolLibSound: false
  ## 声音名称参考：https://www.spigotmc.org/wiki/cc-sounds-list/
  Delay: 'entity_tnt_primed'
  Success: 'entity_generic_explode'
Titles:
  Enabled: true # 是否启用标题效果
  ## 以下文本均支持 %player%、%x%、%y% 和 %z% 占位符
  NoDelay: # 仅在没有传送等待时间时触发
    Title: '&6正在传送……'
    Subtitle: '&8请稍候'
    SendMessage: true
  Teleport:
    Title: '&6传送成功！'
    Subtitle: '&fx=%x% y=%y% z=%z%'
    SendMessage: true # 是否同时在聊天栏发送传送成功消息
  Delay:
    Title: ''
    Subtitle: '&f将在 %time% 秒后传送……'
    SendMessage: true # 是否同时在聊天栏发送等待消息
  Cancelled:
    Title: '&e你移动了……'
    Subtitle: '&c随机传送已取消！'
    SendMessage: true # 是否同时在聊天栏发送取消消息
  Loading:
    Title: ''
    Subtitle: '&7正在加载区块，请稍候……'
    SendMessage: true # 是否同时在聊天栏发送加载消息
  Failed:
    Title: ''
    Subtitle: '&c传送失败！未找到安全位置'
    SendMessage: true
Particles: # 使用 /rtp info particles 查看粒子列表
  Enabled: true
  Type: # 粒子类型列表：https://github.com/ByteZ1337/ParticleLib/blob/master/src/main/java/xyz/xenondevs/particle/ParticleEffect.java
    - 'EXPLOSION_NORMAL'
    - 'CRIT'
  Shape: 'EXPLODE' # 可用形状：Scan、Teleport、Explode；使用 /rtp info shapes 查看列表
Invincible: # 传送后无敌保护
  Enabled: true
  Seconds: 5
Potions: # 使用 /rtp info potion_effects 查看药水效果列表
  Enabled: true
  Types: # 格式：<药水名称>:[持续 tick]:[等级]；默认持续 60 tick、等级 1
    - 'Blindness:60:1'
    - 'Invisibility:60:1'
